name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the toolchain pinned by src/go.mod's `toolchain` directive, so the check below does
      # not have to download it. The check enforces that pin itself either way.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: |
            src/go.sum
            tools/*.sum

      # The same command the pre-commit hook and the docs run; every check tool is pinned in tools/.
      - name: Run checks
        run: go -C tools run ./check
